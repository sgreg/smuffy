<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>smuffy</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div style="text-align: center;">
    <div style="font-size: 4em; font-weight: bold;">
    smuffy
    </div>
</div>
{{if not .Username}}
<div style="margin-top:100px;">
    <div id="auth" style="display: flex; justify-content: center; align-items: center;">
        <a href="{{.AuthUrl}}" style="font-weight: bolder; text-decoration: none;">
            <div style="display: flex; justify-content: center; align-items: center; border: 1px solid #f0f0f0; border-radius: 8px; padding: 8px; background-color: #000">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 512" width="40px">
                        <!--!Font Awesome Free v5.15.4 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                        <path d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8zm100.7 364.9c-4.2 0-6.8-1.3-10.7-3.6-62.4-37.6-135-39.2-206.7-24.5-3.9 1-9 2.6-11.9 2.6-9.7 0-15.8-7.7-15.8-15.8 0-10.3 6.1-15.2 13.6-16.8 81.9-18.1 165.6-16.5 237 26.2 6.1 3.9 9.7 7.4 9.7 16.5s-7.1 15.4-15.2 15.4zm26.9-65.6c-5.2 0-8.7-2.3-12.3-4.2-62.5-37-155.7-51.9-238.6-29.4-4.8 1.3-7.4 2.6-11.9 2.6-10.7 0-19.4-8.7-19.4-19.4s5.2-17.8 15.5-20.7c27.8-7.8 56.2-13.6 97.8-13.6 64.9 0 127.6 16.1 177 45.5 8.1 4.8 11.3 11 11.3 19.7-.1 10.8-8.5 19.5-19.4 19.5zm31-76.2c-5.2 0-8.4-1.3-12.9-3.9-71.2-42.5-198.5-52.7-280.9-29.7-3.6 1-8.1 2.6-12.9 2.6-13.2 0-23.3-10.3-23.3-23.6 0-13.6 8.4-21.3 17.4-23.9 35.2-10.3 74.6-15.2 117.5-15.2 73 0 149.5 15.2 205.4 47.8 7.8 4.5 12.9 10.7 12.9 22.6 0 13.6-11 23.3-23.2 23.3z"/>
                    </svg>
                </div>
                <div style="font-size: 1.2em; margin: 0 20px; text-align: center; color: #f0f0f0;">
                    Authenticate with Spotify
                </div>
            </div>
        </a>
    </div>
</div>
{{else}}
<div style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <div style="margin-top:40px;">
        <div id="runstate">
            <div hx-get="/runstate" hx-target="#runstate" hx-swap="innerHTML" hx-trigger="load">
                Loading run state...
            </div>
        </div>
    </div>

    <div id="content" class="box" hx-get="/playing/0" hx-trigger="load" hx-swap="innerHTML" style="width:50%">
        <em>Loading currently played song...</em>
    </div>
</div>
{{end}}
</body>
</html>

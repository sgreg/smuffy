<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Hello</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        .box {
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px
        }

        #playlist {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
{{if not .Username}}
<h1>Authentication with Spotify is needed</h1>
<a href="{{.AuthUrl}}">Authenticate with Spotify</a>
{{else}}
<h1>Hello, {{.Username}}</h1>

<div id="runstate">
    <div hx-get="/runstate" hx-target="#runstate" hx-swap="innerHTML" hx-trigger="load">
        Loading run state
    </div>
</div>
<div id="playlist">
    <div hx-get="/playlist-active" hx-target="#playlist" hx-swap="innerHTML" hx-trigger="load">
        Loading active playlist
    </div>
</div>

<nav>
    <a href="#" hx-get="/now" hx-target="#content" hx-swap="innerHTML">Now Playing</a> |
    <a href="#" hx-get="/last/5" hx-target="#content" hx-swap="innerHTML">Last 5 songs</a> |
    <a href="#" hx-get="/playlists" hx-target="#content" hx-swap="innerHTML">Your Playlists</a>
</nav>
<p></p>
<div id="content" class="box" hx-get="/now" hx-trigger="load" hx-swap="innerHTML">
    <em>Loading last 5 songs…</em>
</div>
{{end}}
</body>
</html>
